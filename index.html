<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Make a Pizza</title>
  </head>
  <body>
    <div class = "section home">
      <video autoplay loop muted playsinline id="background-video">
        <source src="./resources/background.mp4" type="video/mp4">
      </video>
      <div class = "btn-row">
      </div>
    </div>
    <div class = "section game">
      <access-button class="home-button">
        <img src = "./resources/home.svg" />
      </access-button>
      <make-it-game></make-it-game>
    </div>
    
    <script type="module"src = "./index.js" ></script>

    </script>
    <style>

    body[location = "home"] .section.game {
      display: none;
    }

    body:not([location = "home"]) .section.home {
      display: none;
    }

    .home-button {
      filter: drop-shadow(2px 4px 15px #100);
    }

    .btn-row access-button img {
      width: 20vw;
      cursor: pointer;
      transition: 0.3s ease transform, 0.3s ease filter;
    }

    .btn-row access-button:hover img,
    .btn-row access-button[hover] img {
      transform: scale(1.1);
      filter: drop-shadow(2px 4px 15px #100);
    }

    .btn-row {
      display: flex;
      position: absolute;
      top: 65%;
      left: 50%;
      transform: translate(-50%, -50%);
      gap: 3vw;
    }

    video {
      object-fit: cover;
      position: absolute;
      top: 50%;
      left: 50%;
      height: 100%;
      width: 100%;
      transform: translate(-50%, -50%);
    }
    .home-button {
      position: absolute;
      top: 26vh;
      left: 1em;
      z-index: 1000;
      padding: 1em 1em 1em 0;
      transition: transform 0.2s ease;
    }
    .home-button:hover,
    .home-button[hover] {
      transform: scale(1.1);
    }
    .home-button img {
      width: 15vw;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
   
    </style>
  </body>
</html>
